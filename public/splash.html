<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121213" />
    <title>WordsGuess</title>
    <style>
      :root {
        --bg: #121213;
        --panel: #1a1b1d;
        --tile: #3a3a3c;
        --accent: #c9b458;
        --text: #f5f5f5;
        --muted: #a9a9a9;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(90vw, 420px);
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      }

      .brand {
        font-weight: 800;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.08em;
        margin-bottom: 12px;
      }

      .brand .guess {
        color: var(--accent);
      }

      .loader {
        width: 52px;
        height: 52px;
        margin: 20px auto 18px;
        border: 4px solid rgba(255,255,255,0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <div class="brand">Words<span class="guess">Guess</span></div>
      <div class="loader" aria-hidden="true"></div>
      <p>Loading today's word...</p>
    </main>

    <script>
      const target = "/";
      const redirect = () => {
        if (window.location.pathname.endsWith("/splash.html") || window.location.pathname.endsWith("splash.html")) {
          window.location.replace(target);
        }
      };
      setTimeout(redirect, 900);
    </script>
  </body>
</html>
